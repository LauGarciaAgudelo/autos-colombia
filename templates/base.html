<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Parqueadero Autos Colombia{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="contenedor-pagina">
        <header class="encabezado">
            <h1 class="encabezado-titulo">Sistema de Parqueadero - Autos Colombia</h1>
            <nav class="menu">
                <a class="menu-enlace {% if request.endpoint == 'inicio' %}activo{% endif %}"
                   href="{{ url_for('inicio') }}">Inicio</a>
                <a class="menu-enlace {% if request.endpoint == 'entrada' %}activo{% endif %}"
                   href="{{ url_for('entrada') }}">Registrar entrada</a>
                <a class="menu-enlace {% if request.endpoint == 'salida' %}activo{% endif %}"
                   href="{{ url_for('salida') }}">Registrar salida</a>
                <a class="menu-enlace {% if request.endpoint == 'historial' %}activo{% endif %}"
                   href="{{ url_for('historial') }}">Historial</a>
                <a class="menu-enlace {% if request.endpoint in ('usuarios', 'registrar_usuario', 'actualizar_usuario') %}activo{% endif %}"
                   href="{{ url_for('usuarios') }}">Usuarios</a>
                <a class="menu-enlace {% if request.endpoint in ('celdas', 'asignar_celda') %}activo{% endif %}"
                   href="{{ url_for('celdas') }}">Celdas</a>
            </nav>
        </header>

        <main class="tarjeta">
            {% block contenido %}{% endblock %}
        </main>
    </div>
</body>
</html>
